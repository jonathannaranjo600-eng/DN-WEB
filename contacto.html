<html lang="es">

  <meta charset="UTF-8" />

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="estilos.css"/>
</head>
<body>

  <canvas id="canvas-olas"></canvas>

  <div class="contenedor-principal">

    <!-- NAV -->
    <nav class="barra-navegacion">
      <div class="nav-logo">
        <img src="assets/denaranjo logo.png" alt="De Naranjo Graphic Design" class="logo-imagen"/>
      </div>
      <div class="grupo-nav-derecha">
        <ul class="nav-enlaces">
          <li><a href="acercade.html" class="enlace-nav">Acerca de</a></li>
          <li><a href="servicios.html" class="enlace-nav">Servicios</a></li>
          <li><a href="proyectos.html" class="enlace-nav">Proyectos</a></li>
          <li><a href="contacto.html" class="enlace-nav enlace-nav--activo">Contacto</a></li>
        </ul>
        <button class="boton-menu-hamburguesa" id="boton-menu" aria-label="Abrir menú">
          <span class="linea-hamburguesa"></span>
          <span class="linea-hamburguesa"></span>
          <span class="linea-hamburguesa"></span>
        </button>
      </div>
    </nav>

    <!-- Menú desplegable -->
    <div class="menu-desplegable" id="menu-desplegable">
      <ul class="lista-menu-desplegable">
        <li><span class="enlace-menu-desplegable">Cotizaciones</span></li>
        <li><span class="enlace-menu-desplegable">Preguntas frecuentes</span></li>
        <li><span class="enlace-menu-desplegable">Encode</span></li>
      </ul>
    </div>

    <!-- CONTACTO -->
    <section class="seccion_contacto">

      <!-- Columna izquierda — redes sociales -->
      <div class="columna_redes_contacto">

        <!-- Instagram — reemplaza href con tu perfil -->
        <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" class="icono_red_social" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="#E7E1CA" stroke-width="1.8" fill="none"/>
            <circle cx="12" cy="12" r="4.5" stroke="#E7E1CA" stroke-width="1.8" fill="none"/>
            <circle cx="17.5" cy="6.5" r="1.2" fill="#E7E1CA"/>
          </svg>
        </a>

        <!-- WhatsApp — reemplaza el número en href -->
        <a href="https://wa.me/1234567890" target="_blank" rel="noopener noreferrer" class="icono_red_social" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z" fill="#E7E1CA"/>
          </svg>
        </a>

        <!-- Email — reemplaza href con tu correo -->
        <a href="mailto:tuemail@ejemplo.com" class="icono_red_social" aria-label="Correo electrónico">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="4" width="20" height="16" rx="3" stroke="#E7E1CA" stroke-width="1.8" fill="none"/>
            <path d="M2 7l10 7 10-7" stroke="#E7E1CA" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          </svg>
        </a>

        <!-- LinkedIn — reemplaza href con tu perfil -->
        <a href="https://www.linkedin.com" target="_blank" rel="noopener noreferrer" class="icono_red_social" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="20" height="20" rx="4" stroke="#E7E1CA" stroke-width="1.8" fill="none"/>
            <path d="M7 10v7M7 7v.5" stroke="#E7E1CA" stroke-width="2" stroke-linecap="round"/>
            <path d="M11 17v-4c0-1.5 1-2 2-2s2 .5 2 2v4M11 10v7" stroke="#E7E1CA" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </a>

      </div>

      <!-- Formulario -->
      <div class="contenedor_formulario_contacto">

        <h2 class="titulo_contacto">Hablame sobre tu proyecto</h2>
        <p class="subtitulo_contacto">¿Tienes en mente un proyecto diferente? hazme saber tu proyecto para recibir una cotización personalizada en menos de 48 horas</p>

        <form class="formulario_contacto" id="formulario_contacto" novalidate>

          <div class="campo_formulario">
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Nombre"
              class="input_formulario"
              autocomplete="name"
              required
            />
          </div>

          <div class="campo_formulario">
            <input
              type="email"
              id="correo"
              name="correo"
              placeholder="Correo"
              class="input_formulario"
              autocomplete="email"
              required
            />
          </div>

          <div class="campo_formulario">
            <textarea
              id="descripcion"
              name="descripcion"
              placeholder="Descripción del proyecto"
              class="input_formulario textarea_formulario"
              rows="3"
              required
            ></textarea>
          </div>

          <!-- reCAPTCHA v2 — registra tu sitio en https://www.google.com/recaptcha y reemplaza TU_SITE_KEY -->
          <div class="g-recaptcha" data-sitekey="TU_SITE_KEY" data-theme="dark"></div>

          <button type="submit" class="boton_enviar_contacto">Enviar</button>

        </form>

      </div>

    </section>

  </div>

  <!-- reCAPTCHA API -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script src="funcionalidad.js"></script>
</body>
</html>
